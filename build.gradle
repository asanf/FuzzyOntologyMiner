plugins {
	id 'java'
	id 'application'
}

group = 'fuzzyOntologyMiner'
version = '0.2'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
		// OWL writing
		implementation "net.sourceforge.owlapi:owlapi-distribution:3.4.4"
		
		// Text tokenization and pos tagging
		implementation "edu.stanford.nlp:stanford-corenlp:1.2.0"
		
		// Logging
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1' 
    implementation 'org.apache.logging.log4j:log4j-core:2.22.1'
		
		// Tests
		testImplementation "org.junit.jupiter:junit-jupiter:5.7.1"
		testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

application {
	mainClass = 'fuzzyOntologyMiner.main.Main'
}

tasks.named('test', Test) {
	def testOutputDir = layout.buildDirectory.dir("test-results/test_output")
	
	doFirst {
		testOutputDir.get().asFile.mkdirs()
	}
	
	systemProperty 'testOutputDir', testOutputDir.get().asFile.absolutePath
	
	outputs.dir(testOutputDir).optional()
	
	useJUnitPlatform()
}